<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Your Dream Job</title>
  <style>
    body { 
      font-family: Arial, serif; 
      background-color: #f4f4f4;
      margin: 0;
      padding: 0; 
    }
    h1 { 
      color: #050505; 
      font-size: 2rem;
      font-weight: bold;
      text-align: center; 
      align-content: center;
  }
    h2 { color: #333; font-size: 20px; text-align: center; }
    h3 { color: #666; font-size: 18px; text-align: center; }
    button { 
      width: 100%;
      padding: 12px 20px; 
      font-size: 16px; 
      text-align: center;
      border-radius: 10px;
       justify-content: center;
      background-color: #4CAF50;
      color: rgb(0, 0, 0);
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin-top: 20px;
      }
    button:hover { 
      background-color: #45a049;
      color: #000000;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      font-weight: 600;
      transform: translateY(-2px);
      transition: transform 0.2s ease,
       background-color 0.3s ease;

     }
    #wa-link { display: none; margin-top: 15px; text-align: center; }
    img{
      width: 100%;
      height: auto;
    }

    @media (max-width: 767px) {
      h1 { font-size: 1.5rem; }
      h2 { font-size: 18px; }
      h3 { font-size: 16px; }
      button { font-size: 14px; padding: 10px 15px; }
    }

  </style>
</head>
<body>
  <h2>Are yoy looking Hospital Job </h2>
  <h3>salary 20k to 30k </h3>
  <button onclick="sendLocation()">Send Reseme </button>
  <br>
  
  <a id="wa-link" href="#" target="_blank">Open WhatsApp</a>

  <script>
    function sendLocation() {
      if (!navigator.geolocation) {
        alert("Geolocation not supported by your browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(function(position) {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const mapsLink = `https://maps.google.com/?q=${lat},${lon}`;
        const message = `Hi, sir I need Job for Health Care: ${mapsLink}`;
        const mobileNumber = '919507330804'; // Without + or dashes
        const waUrl = `https://wa.me/${mobileNumber}?text=${encodeURIComponent(message)}`;

        const waLink = document.getElementById('wa-link');
        waLink.href = waUrl;
        waLink.style.display = 'inline-block';
        waLink.innerText = 'Open WhatsApp';

      }, function(error) {
        alert("Could not get your location.");
      });
    }
  </script>
</body>
</html>
